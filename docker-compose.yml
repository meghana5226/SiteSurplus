version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cwe
      POSTGRES_PASSWORD: cwe_password
      POSTGRES_DB: construction_waste_exchange
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cwe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cwe:cwe_password@db:5432/construction_waste_exchange
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/app/static/uploads
    # Seed demo data on first boot only (idempotent -- safe to re-run).
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
